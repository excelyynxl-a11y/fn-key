services:
  server:
    build: ./server
    init: true
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      NODE_ENV: development
      PORT: ${PORT:-5000}
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in the root .env file (MongoDB Atlas)}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      OPENAI_MAX_ATTEMPTS: ${OPENAI_MAX_ATTEMPTS:-3}
      OPENAI_TIMEOUT_MS: ${OPENAI_TIMEOUT_MS:-20000}
      OPENAI_INPUT_COST_PER_MILLION: ${OPENAI_INPUT_COST_PER_MILLION:-0}
      OPENAI_OUTPUT_COST_PER_MILLION: ${OPENAI_OUTPUT_COST_PER_MILLION:-0}
      CLASSIFICATION_MIN_SCORE: ${CLASSIFICATION_MIN_SCORE:-4}
      CLASSIFICATION_MIN_MARGIN: ${CLASSIFICATION_MIN_MARGIN:-1.5}
      DATASET_PATH: /data/sdoc
      PROCESSING_CONCURRENCY: ${PROCESSING_CONCURRENCY:-4}
    volumes:
      - ./server:/app
      - ./sdoc-hackathon-bundle:/data/sdoc:ro
      - server_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && exec npm run dev"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  client:
    build: ./client
    init: true
    ports:
      - "${CLIENT_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      WATCH_USE_POLLING: ${WATCH_USE_POLLING:-true}
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && exec npm run dev"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  server_node_modules:
  client_node_modules:
