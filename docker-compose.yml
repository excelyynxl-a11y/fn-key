services:
  mongodb:
    image: mongo:8.0
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  server:
    build: ./server
    init: true
    ports:
      - "127.0.0.1:${PORT:-5000}:${PORT:-5000}"
    environment:
      NODE_ENV: development
      PORT: ${PORT:-5000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongodb:27017/mern_database}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && exec npm run dev"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + process.env.PORT + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  client:
    build: ./client
    init: true
    ports:
      - "127.0.0.1:${CLIENT_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      WATCH_USE_POLLING: ${WATCH_USE_POLLING:-true}
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: sh -c "npm ci --no-audit --no-fund && exec npm run dev"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mongodb_data:
  server_node_modules:
  client_node_modules:
